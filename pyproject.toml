[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lms"
version = "1.0.0"
authors = [{ name = "David Shilvock" }]
description = "Command line tool for Lyrion Media Server"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]

dependencies = []

[project.optional-dependencies]
dev = [
    "build",
    "coverage",
]

[project.scripts]
lms = "lms:main"

[tool.setuptools]
py-modules = ["lms"]